# taxonomies/vlm/shoes.yaml
# ═══════════════════════════════════════════════════════════════════════════
# VLM (Claude API) configuration for the shoes domain.
#
# Vocabulary is aligned exactly with the Inflowe frontend filters:
#   - Model Details: toe_shape, heel_type, heel_height, straps_and_closure
#   - Embellishments: all 22 attributes from embellishments.yaml
#
# Four API calls per image:
#   Group 1 — toe_shape         (categorical, 1 call)
#   Group 2 — heel              (heel_type + heel_height, 1 call)
#   Group 3 — straps_and_closure (boolean, 1 call)
#   Group 4 — embellishments    (boolean, 1 call)
#
# Naming conventions match frontend exactly (hyphens, lowercase).
# ═══════════════════════════════════════════════════════════════════════════

domain: shoes
model: claude-sonnet-4-6
max_workers: 4
retry_attempts: 3
retry_delay_s: 5.0

attribute_groups:

  # ── Group 1: Toe shape ──────────────────────────────────────────────────
  toe_shape:
    label_type: categorical
    system_prompt: >
      You are a footwear attribute recognition system specialised in toe shapes. Examine the toe box area of the shoe carefully. Choose exactly one toe shape from the provided list. If the toe is not clearly visible, choose the closest match from what is visible. Respond with valid JSON only — no explanation, no markdown.
    attributes:
      toe_shape:
        type: categorical
        classes:
        - open-toe
        - pointed-toe
        - round-toe
        - square-toe
        descriptions:
          open-toe: "No closed toe box — toes fully exposed (sandals, peep-toe, slides)"
          pointed-toe: "Sharply tapered toe box narrowing to a distinct point"
          round-toe: "Softly rounded toe box with a curved front edge"
          square-toe: "Flat squared-off toe box with a straight front edge"

  # ── Group 2: Heel type + heel height ────────────────────────────────────
  heel:
    label_type: categorical
    system_prompt: >
      You are a footwear attribute recognition system specialised in heel analysis. Examine the heel of the shoe carefully. You must return two independent attributes:
        heel_type  — the structural shape of the heel
        heel_height — the approximate height band
      Choose exactly one value for each from the provided lists. Respond with valid JSON only — no explanation, no markdown.
    attributes:
      heel_type:
        type: categorical
        classes:
        - flat-heel
        - kitten-heel
        - stiletto-heel
        - cone-heel
        - wedge-heel
        - comma-heel
        - french-heel
        - platform
        - block-heel
        descriptions:
          flat-heel: "No heel elevation or less than 1cm — completely flat sole"
          kitten-heel: "Thin, slightly tapered heel 3–5cm — short and delicate"
          stiletto-heel: "Very thin tall heel 7cm+ — needle-like, no taper at base"
          cone-heel: "Conical heel wide at top tapering to a smaller point at base"
          wedge-heel: "Solid heel that extends continuously under the arch to the toe"
          comma-heel: "Curved heel that sweeps forward at the base like a comma shape"
          french-heel: "Curved heel that kicks back slightly at top — Louis or curved heel"
          platform: "Thick sole elevation at the toe AND heel — platform construction"
          block-heel: "Wide rectangular heel with substantial flat base — chunky, stable"
      heel_height:
        type: categorical
        classes:
        - flat-heel
        - low-heel
        - mid-heel
        - high-heel
        descriptions:
          flat-heel: "No elevation or under 2cm"
          low-heel: "2–4cm heel height"
          mid-heel: "4–7cm heel height"
          high-heel: "Over 7cm heel height"

  # ── Group 3: Straps and closure ─────────────────────────────────────────
  straps_and_closure:
    label_type: multi_label
    system_prompt: >
      You are a footwear attribute recognition system specialised in straps and closures. Examine the entire shoe carefully including the sides, back and top. Multiple attributes can be present simultaneously on the same shoe. Only mark an attribute true if it is clearly and unambiguously visible. Do not infer — if you cannot see it, mark it false. Respond with valid JSON only — no explanation, no markdown.
    attributes:
      ankle-strap:
        description: "Single strap encircling the ankle — fastened at the side or back"
      ankle-wrap:
        description: "Lace or ribbon that wraps and ties around the ankle — multiple times"
      single-strap:
        description: "One strap across the vamp (instep) — not ankle strap"
      double-strap:
        description: "Exactly two parallel straps across the vamp"
      multi-strap:
        description: "Three or more straps across the vamp or foot"
      strappy:
        description: "Overall design defined by multiple thin straps — open, skeletal construction"
      cross-over:
        description: "Straps that cross diagonally over the foot forming an X pattern"
      t-bar:
        description: "T-shaped strap — one horizontal strap across vamp joined by vertical strap to toe. Not vertical toe strap in a thong sandal"
      sling-back:
        description: "Strap crossing behind the heel — no full back counter"
      lace-up:
        description: "Laces threaded through eyelets to fasten the shoe"
      zip-up:
        description: "Zipper closure — on the side, back or inside of the shoe"
      slouch:
        description: "Upper material intentionally falls or gathers loosely — typically on boots"

  # ── Group 4: Embellishments ─────────────────────────────────────────────
  # 47 attributes — full master list aligned with frontend embellishments filter.
  # Prompt is split into two API calls (embellishments_a + embellishments_b)
  # at runtime to keep token count manageable — see note in vlm_tagger.py.
  embellishments:
    label_type: multi_label
    system_prompt: >
      You are a footwear embellishment recognition system. Examine the entire shoe surface carefully including upper, sole edge, heel and straps. Multiple embellishments can be present simultaneously. Only mark an attribute true if it is clearly and unambiguously visible. Do not infer or guess — if you cannot see it clearly, mark it false. Respond with valid JSON only — no explanation, no markdown.
    attributes:
      bead:
        description: "Individual beads or beaded decoration — beaded strap, fringe or surface coverage"
      bow:
        description: "Fabric, leather or ribbon bow — any size or position on the shoe"
      buckle:
        description: "Metal or resin buckle hardware — functional or purely decorative"
      button:
        description: "Decorative button — fabric-covered, metal or resin"
      chain:
        description: "Metal chain detail — as strap, ankle chain, trim or draped decorative element"
      crystal:
        description: "Rhinestone, crystal, diamanté or Swarovski embellishment — sparkle or glitter detail"
      embroidery:
        description: "Thread embroidery stitched into the upper — floral, geometric or figurative"
      eyelet:
        description: "Decorative metal eyelets or grommets used beyond functional lace holes"
      feather:
        description: "Real or faux feather trim — on toe, vamp, ankle or collar"
      flower:
        description: "Flower or floral motif — fabric rosette, leather flower, moulded or printed"
      fringe:
        description: "Hanging fringe strips — leather, suede, fabric or beaded fringe"
      fur:
        description: "Real or faux fur trim — on collar, cuff, toe cap, ankle or sole edge"
      gemstone:
        description: "Natural or synthetic gemstone — turquoise, amber, coral or similar set into upper or heel"
      hardware:
        description: "Decorative metal hardware — logo plaques, bars, D-rings, horsebits, metal heels not buckles"
      lace:
        description: "Lace fabric used as upper material, overlay panel or trim"
      mesh-insert:
        description: "Mesh, net or open-weave fabric panel insert in the upper, not lace"
      patch:
        description: "Fabric, leather or embroidered patch appliquéd or sewn onto the upper"
      pearl:
        description: "Pearl or faux-pearl embellishment — single pearl, clustered or pearl trim"
      pom-pom:
        description: "Fluffy pom-pom — fabric, fur or yarn ball attached to toe, strap or heel"
      ribbon:
        description: "Satin, grosgrain or organza ribbon — as trim, lace or bow distinct from fabric bow"
      sequin:
        description: "Sequins or metallic disc embellishment — covering the surface or used as trim strip"
      stud:
        description: "Metal studs or spikes — punk or rock-style embellishment covering surface or as trim"
